<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>ইসলামী বিশ্বকোষ ও আল হাদিস — হাদিস ভিডিও</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap');
:root{--gold:#d8b66a;--gold2:#f4df9b;--green:#1c8a62;--cream:#f7f2e7;--ink:#101b19}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#071c19;color:var(--cream);font-family:"Noto Sans Bengali","Nirmala UI",sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 36%,#194b3c 0%,#0b2c25 42%,#061714 100%)}
.grain{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(#fff 0.6px,transparent .6px);background-size:7px 7px;pointer-events:none}
.frame{position:absolute;inset:42px;border:2px solid rgba(216,182,106,.48);border-radius:34px}
.frame:before,.frame:after{content:"";position:absolute;left:50%;width:160px;height:2px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.frame:before{top:-2px}.frame:after{bottom:-2px}
.topline{position:absolute;top:84px;width:100%;text-align:center;color:var(--gold2);font-size:22px;letter-spacing:5px}
.brand{position:absolute;top:132px;left:0;width:100%;display:flex;justify-content:center;align-items:center;gap:18px}
.brand img{width:82px;height:82px;object-fit:contain;border-radius:16px}
.brand .name{font-size:25px;font-weight:700;letter-spacing:.2px}.brand .sub{font-size:16px;color:#d4cbb4;margin-top:4px}
.art{position:absolute;top:250px;left:0;width:100%;height:580px;display:flex;align-items:center;justify-content:center}
.art svg{width:530px;height:530px;filter:drop-shadow(0 16px 28px #0005)}
.hadith-label{position:absolute;top:822px;width:100%;text-align:center;color:var(--gold2);font-family:Amiri,serif;font-size:28px;letter-spacing:2px}
.rule{position:absolute;top:875px;left:210px;width:660px;height:1px;background:linear-gradient(90deg,transparent,#d8b66a,transparent)}
.caption-wrap{position:absolute;top:925px;left:90px;width:900px;height:500px;display:flex;align-items:center;justify-content:center;text-align:center}
.caption{width:100%;font-size:46px;line-height:1.62;font-weight:600;color:#fff9ec;text-shadow:0 4px 24px #0008;white-space:pre-wrap;overflow-wrap:anywhere;transition:opacity .35s,transform .35s}
.caption.solemn{color:#ffe8a8}.caption.respectful{color:#f8e9be}.caption.thoughtful{color:#d7f1e4}.caption.warm{color:#f7dfb0}.caption.store{font-size:39px}
.arabic{font-family:Amiri,serif;color:var(--gold2);font-size:36px;margin-top:22px;direction:rtl}
.progress-track{position:absolute;left:145px;right:145px;bottom:340px;height:5px;border-radius:8px;background:#ffffff22;overflow:hidden}
.progress{height:100%;width:0;background:linear-gradient(90deg,#a47a35,#f4df9b);box-shadow:0 0 16px #e7c46c}
.footer{position:absolute;bottom:265px;left:0;width:100%;text-align:center;font-size:19px;color:#c7d6ce;letter-spacing:1px}
.cta{position:absolute;bottom:95px;left:0;width:100%;display:flex;align-items:center;justify-content:center}
.cta img{width:360px;height:auto;object-fit:contain;filter:drop-shadow(0 8px 18px #0005)}
.corner{position:absolute;width:44px;height:44px;border-color:var(--gold);opacity:.8}
.c1{top:66px;left:66px;border-top:2px solid;border-left:2px solid}.c2{top:66px;right:66px;border-top:2px solid;border-right:2px solid}.c3{bottom:66px;left:66px;border-bottom:2px solid;border-left:2px solid}.c4{bottom:66px;right:66px;border-bottom:2px solid;border-right:2px solid}
</style>
</head>
<body>
<div id="stage">
 <div class="grain"></div><div class="frame"></div>
 <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
 <div class="topline">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
 <div class="brand"><img src="logo.png"><div><div class="name">ইসলামী বিশ্বকোষ ও আল হাদিস</div><div class="sub">জ্ঞান • আমল • বিশুদ্ধ নিয়ত</div></div></div>
 <div class="art">
  <svg viewBox="0 0 600 600" role="img" aria-label="Islamic vector illustration">
   <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5e3a3"/><stop offset="1" stop-color="#b58b3e"/></linearGradient><linearGradient id="d" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62d86c"/><stop offset="1" stop-color="#08794a"/></linearGradient></defs>
   <path d="M102 465 A228 228 0 1 1 493 144 A194 194 0 1 0 102 465Z" fill="url(#g)" opacity=".95"/>
   <g stroke="#e5c979" stroke-width="3" fill="none" opacity=".7"><circle cx="300" cy="300" r="220"/><circle cx="300" cy="300" r="205" stroke-dasharray="3 12"/></g>
   <!-- Minbar with Arabic inscription -->
   <g transform="translate(80 210)">
    <path d="M28 210h160v125H28z" fill="#b78c46"/><path d="M42 225h132v95H42z" fill="#f4e7c4"/>
    <path d="M28 210l80-62 80 62" fill="#d8b66a"/><path d="M49 212l59-45 59 45" fill="#254b3c"/>
    <path d="M49 250h118M49 275h118M49 300h118" stroke="#b78c46" stroke-width="4"/>
    <text x="108" y="292" text-anchor="middle" font-family="Amiri,serif" font-size="24" fill="#174334">المنبر</text>
    <path d="M55 145v-45q0-20 18-20t18 20v45M125 145v-45q0-20 18-20t18 20v45" fill="#0d201b" stroke="#d8b66a" stroke-width="4"/>
    <path d="M62 80l11-24 11 24M132 80l11-24 11 24" fill="#d8b66a"/>
   </g>
   <!-- Kaaba -->
   <g transform="translate(220 250)">
    <path d="M0 85L120 20 238 84 118 151Z" fill="#202a27" stroke="#d8b66a" stroke-width="3"/>
    <path d="M0 85l118 66v145L0 230Z" fill="#101816" stroke="#d8b66a" stroke-width="3"/>
    <path d="M118 151l120-67v146l-120 66Z" fill="#202a27" stroke="#d8b66a" stroke-width="3"/>
    <path d="M0 117l118 65 120-65" fill="none" stroke="#d8b66a" stroke-width="12"/>
    <path d="M0 138l118 65 120-65" fill="none" stroke="#d8b66a" stroke-width="3"/>
    <rect x="139" y="190" width="35" height="70" fill="#d8b66a" opacity=".8"/>
   </g>
   <!-- Green dome -->
   <g transform="translate(265 355)">
    <path d="M0 112Q6 20 85 0Q164 20 170 112Z" fill="url(#d)" stroke="#e5c979" stroke-width="3"/>
    <path d="M85 0v112M45 20q-20 35-18 90M125 20q20 35 18 90" stroke="#a8ef7b" stroke-width="3" opacity=".7" fill="none"/>
    <path d="M78 0v-24h14V0" fill="#d8b66a"/><path d="M85-24l-9-10 9-18 9 18Z" fill="#d8b66a"/>
    <path d="M-6 112h182v13H-6Z" fill="#0a6c43" stroke="#d8b66a" stroke-width="2"/>
    <g fill="#d8b66a"><path d="M15 99v-18q10-12 20 0v18z"/><path d="M48 99v-18q10-12 20 0v18z"/><path d="M101 99v-18q10-12 20 0v18z"/><path d="M134 99v-18q10-12 20 0v18z"/></g>
   </g>
   <g fill="#f4e3ad"><circle cx="120" cy="140" r="4"/><circle cx="476" cy="280" r="4"/><circle cx="455" cy="410" r="3"/><circle cx="170" cy="440" r="3"/></g>
  </svg>
 </div>
 <div class="hadith-label">الحديث النبوي الشريف</div><div class="rule"></div>
 <div class="caption-wrap"><div id="caption" class="caption">আসসালামু আলাইকুম ওয়ারাহমাতুল্লাহ।</div></div>
 <div class="progress-track"><div id="progress" class="progress"></div></div>
 <div class="footer">সহিহ হাদিস • সুন্দর জীবন গড়ার অনুপ্রেরণা</div>
 <div class="cta"><img src="google-play-badge.png" alt="Get it on Google Play"></div>
</div>
<script>
window.setScene = (scene) => {
 const c=document.getElementById('caption');
 c.className='caption '+(scene.tone||'');
 c.textContent=scene.text;
 document.getElementById('progress').style.width=(scene.progress||0)+'%';
 const wrap=document.querySelector('.caption-wrap');
 wrap.style.top=scene.tone==='store'?'900px':'925px';
};
</script>
</body>
</html>
